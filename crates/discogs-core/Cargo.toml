[package]
name = "discogs-core"
edition.workspace = true
version.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "discogs-rs — read the Discogs monthly data dumps fast: gzip, block splitting, parallel byte scanners and per-artist genre/style profiles."
keywords = ["discogs", "dump", "xml", "music", "parallel"]
categories = ["parser-implementations", "multimedia::audio"]

[dependencies]
crossbeam-channel.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
flate2.workspace = true
sha2.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = ["http"]
# HTTPS sources, CHECKSUM.txt and the latest-dump lookup.
http = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
proptest.workspace = true
flate2.workspace = true
criterion.workspace = true

[[bench]]
name = "stages"
harness = false
