[package]
name = "discogs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The scanner and splitter only: no HTTP client in the fuzz build.
discogs-core = { path = "../crates/discogs-core", default-features = false }

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: cargo-fuzz builds it on nightly.
[workspace]
