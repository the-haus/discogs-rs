[workspace]
members = [
    "crates/discogs-core",
    "crates/discogs-cli",
    "crates/discogs-node",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
license-file = "LICENCE.txt"
repository = "https://github.com/the-haus/discogs-rs"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
discogs-core = { path = "crates/discogs-core", version = "=0.2.0" }

# External crates.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
memchr = "2.7"
rustc-hash = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# `asm`: ARMv8 SHA instructions on aarch64 (5× the portable code: 1.9 GB/s
# vs 0.35 GB/s on an M1); x86_64 uses SHA-NI when the CPU has it either way.
sha2 = { version = "0.10", features = ["asm"] }
arrow-array = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
parquet = { version = "57", default-features = false, features = ["arrow", "zstd"] }
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
# HTTPS input: blocking client (its runtime lives on reqwest's own thread),
# rustls with the ring provider and the Mozilla roots built in, so no system
# CA store, OpenSSL or aws-lc build is needed.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
panic = "unwind"

# The benches and the property tests run the scanner over megabytes: keep
# the test profile optimised enough that they finish in seconds.
[profile.test]
opt-level = 2
